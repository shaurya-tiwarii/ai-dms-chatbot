<!doctype html><html><head><meta charset="utf-8"><title>AI DMS Chatbot</title></head><body><h1>AI DMS Chatbot</h1><input id=file type=file accept=".txt,.pdf,.docx"><button onclick=upload()>Upload Document</button><p id=status></p><hr><div id=chat></div><input id=q placeholder="Ask about the document"><button onclick=send()>Send</button><script>async function upload(){let f=document.getElementById('file').files[0],d=new FormData();d.append('document',f);let r=await fetch('/upload',{method:'POST',body:d}),j=await r.json();document.getElementById('status').textContent=j.ok?'Document loaded.':'Error: '+j.error}async function send(){let q=document.getElementById('q');if(!q.value)return;let box=document.getElementById('chat');box.innerHTML+='<p><b>You:</b> '+q.value+'</p>';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})}),j=await r.json();box.innerHTML+='<p><b>AI:</b> '+(j.answer||j.error)+'</p>';q.value=''}</script></body></html>
