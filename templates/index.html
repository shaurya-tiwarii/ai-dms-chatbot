<!doctype html><html><head><meta charset="utf-8"><title>AI DMS Chatbot</title><style>body{font-family:Arial;background:#f4f7fb;max-width:850px;margin:50px auto}.box{background:white;padding:25px;border-radius:16px;margin:15px 0;box-shadow:0 5px 25px #0001}button{background:#1769aa;color:white;border:0;padding:11px 18px;border-radius:9px}input{padding:10px;width:70%}#chat{min-height:250px}.msg{padding:12px;margin:8px;border-radius:10px;background:#eef4fa}</style></head><body><h1>AI DMS Chatbot</h1><div class=box><input id=file type=file accept=".txt,.pdf,.docx"><button onclick=upload()>Upload Document</button><p id=status></p></div><div class=box><div id=chat></div><input id=q placeholder="Ask about the document"><button onclick=send()>Send</button></div><script>async function upload(){let f=document.getElementById('file').files[0],d=new FormData();d.append('document',f);let r=await fetch('/upload',{method:'POST',body:d}),j=await r.json();status.textContent=j.ok?'Document loaded.':'Error: '+j.error}async function send(){let q=document.getElementById('q').value;if(!q)return;chat.innerHTML+='<div class=msg><b>You:</b> '+q+'</div>';q=document.getElementById('q');let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})}),j=await r.json();chat.innerHTML+='<div class=msg><b>AI:</b> '+(j.answer||j.error)+'</div>';q.value=''}</script></body></html>
